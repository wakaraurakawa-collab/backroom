<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちいさな生き物観察 - バックルーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #C7BFA0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
  #canvas-container { position: fixed; inset: 0; }
  #hint {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #5b5347; background: rgba(255,255,255,0.55);
    padding: 6px 14px; border-radius: 999px; letter-spacing: 0.02em;
  }
  #panel {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(360px, calc(100vw - 24px));
    background: rgba(255,255,255,0.82); backdrop-filter: blur(8px);
    border-radius: 18px; padding: 14px 16px;
    box-shadow: 0 8px 28px rgba(60,50,40,0.18);
  }
  #sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-bottom: 10px; }
  .row { display: flex; flex-direction: column; gap: 2px; }
  .row label {
    font-size: 11px; color: #5b5347; display: flex; justify-content: space-between;
  }
  .row input[type=range] { width: 100%; height: 16px; }
  #countSlider { accent-color: #7fb98d; }
  #fightSlider { accent-color: #d9534f; }
  #fleeSlider { accent-color: #cf9a4c; }
  #talkSlider { accent-color: #6fa8d6; }
  #regen {
    width: 100%; font-size: 14px; font-weight: 600; color: #fff; background: #7fb98d;
    border: none; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #regen:hover { background: #6fa87d; transform: scale(1.02); }
  #regen:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="hint">ドラッグで視点を回転・スクロールでズーム</div>
<div id="panel">
  <div id="sliders">
    <div class="row"><label>生き物の数 <span id="countVal">8</span></label>
      <input type="range" id="countSlider" min="3" max="16" step="1" value="8"></div>
    <div class="row"><label>戦う <span id="fightVal">30</span></label>
      <input type="range" id="fightSlider" min="0" max="100" step="1" value="30"></div>
    <div class="row"><label>逃げる <span id="fleeVal">40</span></label>
      <input type="range" id="fleeSlider" min="0" max="100" step="1" value="40"></div>
    <div class="row"><label>話す <span id="talkVal">30</span></label>
      <input type="range" id="talkSlider" min="0" max="100" step="1" value="30"></div>
  </div>
  <button id="regen">マップを作り直す</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ================= grid / maze generation (BSP) =================
  const GRID_W = 16, GRID_H = 16, CELL = 2.4, WALL_H = 2.5;
  const WALL = 0, FLOOR = 1;

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  let grid, floorCells;

  function generateMaze() {
    const g = Array.from({ length: GRID_H }, () => new Array(GRID_W).fill(WALL));

    function carveRoom(rx, ry, rw, rh) {
      const pad = 1;
      const availW = rw - pad * 2, availH = rh - pad * 2;
      const roomW = Math.max(3, availW - Math.floor(rand(0, 2)));
      const roomH = Math.max(3, availH - Math.floor(rand(0, 2)));
      const roomX = rx + pad + Math.floor(Math.random() * Math.max(1, availW - roomW + 1));
      const roomY = ry + pad + Math.floor(Math.random() * Math.max(1, availH - roomH + 1));
      for (let y = roomY; y < roomY + roomH; y++)
        for (let x = roomX; x < roomX + roomW; x++)
          if (y >= 0 && y < GRID_H && x >= 0 && x < GRID_W) g[y][x] = FLOOR;
      return { cx: Math.floor(roomX + roomW / 2), cy: Math.floor(roomY + roomH / 2) };
    }

    function connect(a, b) {
      let x = a.cx, y = a.cy;
      const tx = b.cx, ty = b.cy;
      const xFirst = Math.random() < 0.5;
      if (xFirst) {
        while (x !== tx) { g[y][x] = FLOOR; x += x < tx ? 1 : -1; }
        while (y !== ty) { g[y][x] = FLOOR; y += y < ty ? 1 : -1; }
      } else {
        while (y !== ty) { g[y][x] = FLOOR; y += y < ty ? 1 : -1; }
        while (x !== tx) { g[y][x] = FLOOR; x += x < tx ? 1 : -1; }
      }
      g[ty][tx] = FLOOR;
    }

    const minLeaf = 5;
    function split(rx, ry, rw, rh, depth) {
      const canW = rw >= minLeaf * 2, canH = rh >= minLeaf * 2;
      if (depth <= 0 || (!canW && !canH)) return carveRoom(rx, ry, rw, rh);
      const splitVertical = (canW && canH) ? (rw > rh ? true : (rh > rw ? false : Math.random() < 0.5)) : canW;
      if (splitVertical) {
        const at = Math.floor(rand(minLeaf, rw - minLeaf));
        const a = split(rx, ry, at, rh, depth - 1);
        const b = split(rx + at, ry, rw - at, rh, depth - 1);
        connect(a, b);
        return Math.random() < 0.5 ? a : b;
      } else {
        const at = Math.floor(rand(minLeaf, rh - minLeaf));
        const a = split(rx, ry, rw, at, depth - 1);
        const b = split(rx, ry + at, rw, rh - at, depth - 1);
        connect(a, b);
        return Math.random() < 0.5 ? a : b;
      }
    }
    split(0, 0, GRID_W, GRID_H, 4);
    return g;
  }

  function gridToWorld(gx, gz) {
    return { x: (gx - GRID_W / 2 + 0.5) * CELL, z: (gz - GRID_H / 2 + 0.5) * CELL };
  }
  function worldToGrid(x, z) {
    return {
      gx: clamp(Math.round(x / CELL + GRID_W / 2 - 0.5), 0, GRID_W - 1),
      gz: clamp(Math.round(z / CELL + GRID_H / 2 - 0.5), 0, GRID_H - 1)
    };
  }
  function nearestFloorCell(gx, gz) {
    if (grid[gz] && grid[gz][gx] === FLOOR) return { gx, gz };
    for (let r = 1; r < 5; r++) {
      for (let dz = -r; dz <= r; dz++) {
        for (let dx = -r; dx <= r; dx++) {
          const nx = gx + dx, nz = gz + dz;
          if (nx >= 0 && nz >= 0 && nx < GRID_W && nz < GRID_H && grid[nz][nx] === FLOOR) return { gx: nx, gz: nz };
        }
      }
    }
    return floorCells[0];
  }

  function findPath(startCell, goalCell) {
    if (startCell.gx === goalCell.gx && startCell.gz === goalCell.gz) return [startCell];
    const key = (x, z) => x + ',' + z;
    const visited = new Set([key(startCell.gx, startCell.gz)]);
    const cameFrom = new Map();
    const queue = [startCell];
    let qi = 0;
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    let found = false;
    while (qi < queue.length) {
      const cur = queue[qi++];
      if (cur.gx === goalCell.gx && cur.gz === goalCell.gz) { found = true; break; }
      for (const [dx, dz] of dirs) {
        const nx = cur.gx + dx, nz = cur.gz + dz;
        if (nx < 0 || nz < 0 || nx >= GRID_W || nz >= GRID_H) continue;
        if (grid[nz][nx] !== FLOOR) continue;
        const k = key(nx, nz);
        if (visited.has(k)) continue;
        visited.add(k);
        cameFrom.set(k, cur);
        queue.push({ gx: nx, gz: nz });
      }
    }
    if (!found) return null;
    let path = [goalCell];
    let curKey = key(goalCell.gx, goalCell.gz);
    while (curKey !== key(startCell.gx, startCell.gz)) {
      const prev = cameFrom.get(curKey);
      path.push(prev);
      curKey = key(prev.gx, prev.gz);
    }
    path.reverse();
    return path;
  }

  function pickFleeTarget(threatCell) {
    let best = null, bestDist = -1;
    for (let i = 0; i < 12; i++) {
      const cand = pick(floorCells);
      const d = Math.hypot(cand.gx - threatCell.gx, cand.gz - threatCell.gz);
      if (d > bestDist) { bestDist = d; best = cand; }
    }
    return best;
  }

  // ================= three.js setup =================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const bgColor = 0xC7BFA0;
  scene.background = new THREE.Color(bgColor);
  scene.fog = new THREE.Fog(bgColor, 26, 62);

  const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const hemi = new THREE.HemisphereLight(0xf5f0e0, 0xb8a978, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xf5f0dc, 1.0);
  sun.position.set(14, 22, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -22;
  sun.shadow.camera.right = 22;
  sun.shadow.camera.top = 22;
  sun.shadow.camera.bottom = -22;
  sun.shadow.camera.updateProjectionMatrix();
  scene.add(sun);

  const critterColors = [0xFFB4A2, 0xA8E6CE, 0xC8B6E2, 0xFFE28A, 0x9AD1F0, 0xFFAFC5, 0xFFF3C4];
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xE3D28E });
  const floorMat = new THREE.MeshLambertMaterial({ color: 0xC7B48A });
  const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const floorGeo = new THREE.PlaneGeometry(GRID_W * CELL, GRID_H * CELL);

  const worldGroup = new THREE.Group();
  scene.add(worldGroup);
  let critters = [];
  let effects = [];

  function clearGroup(group) {
    // Walls/floor share geometry+material singletons (wallGeo/wallMat/floorMat/floorGeo) that get
    // reused on every regenerate, so this just detaches children without disposing GPU resources.
    group.children.slice().forEach(child => group.remove(child));
  }

  function disposeCritter(c) {
    // Each critter's meshes are created fresh per-instance in makeCritter(), so these DO need disposal.
    c.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    });
  }

  function buildEnvironment() {
    grid = generateMaze();
    floorCells = [];
    for (let z = 0; z < GRID_H; z++)
      for (let x = 0; x < GRID_W; x++)
        if (grid[z][x] === FLOOR) floorCells.push({ gx: x, gz: z });

    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    worldGroup.add(floor);

    for (let z = 0; z < GRID_H; z++) {
      for (let x = 0; x < GRID_W; x++) {
        if (grid[z][x] !== WALL) continue;
        const w = new THREE.Mesh(wallGeo, wallMat);
        const p = gridToWorld(x, z);
        w.position.set(p.x, WALL_H / 2, p.z);
        w.castShadow = true;
        w.receiveShadow = true;
        worldGroup.add(w);
      }
    }
  }

  function makeCritter(color) {
    const g = new THREE.Group();
    const r = 0.4;
    const body = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshLambertMaterial({ color }));
    body.scale.set(1, 1.2, 1);
    body.position.y = r * 1.2;
    body.castShadow = true;
    g.add(body);

    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x3a332c });
    [-0.14, 0.14].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), eyeMat);
      eye.position.set(ex, r * 1.2 + 0.08, r * 0.82);
      g.add(eye);
    });

    if (Math.random() < 0.55) {
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 0.22, 6), new THREE.MeshLambertMaterial({ color }));
      stem.position.y = r * 2.4 + 0.11;
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshLambertMaterial({ color: pick(critterColors) }));
      tip.position.y = r * 2.4 + 0.28;
      g.add(stem, tip);
    }

    g.userData = {
      path: [], state: 'idle', timer: rand(0, 1.2), fleeTimer: 0, encTimer: 0,
      encounterCooldown: 0, speed: rand(1.5, 2.1), bobPhase: rand(0, Math.PI * 2), facing: 0
    };
    return g;
  }

  function spawnCritters(count) {
    critters.forEach(c => { worldGroup.remove(c); disposeCritter(c); });
    critters = [];
    for (let i = 0; i < count; i++) {
      const c = makeCritter(pick(critterColors));
      const cell = pick(floorCells);
      const p = gridToWorld(cell.gx, cell.gz);
      c.position.set(p.x, 0, p.z);
      worldGroup.add(c);
      critters.push(c);
    }
    document.getElementById('countVal').textContent = count;
  }

  function buildWorld(count) {
    clearGroup(worldGroup);
    effects.forEach(e => { scene.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); });
    effects = [];
    buildEnvironment();
    spawnCritters(count);
  }

  buildWorld(8);

  // ================= behavior effects =================
  function spawnEffect(pos, type) {
    let mesh;
    if (type === 'fight') {
      mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 0), new THREE.MeshBasicMaterial({ color: 0xE24B4A, transparent: true, opacity: 0.9 }));
    } else if (type === 'communicate') {
      mesh = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 8, 16), new THREE.MeshBasicMaterial({ color: 0x6fa8d6, transparent: true, opacity: 0.9 }));
      mesh.rotation.x = Math.PI / 2;
    } else {
      mesh = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 4), new THREE.MeshBasicMaterial({ color: 0xF5F0E0, transparent: true, opacity: 0.9 }));
    }
    mesh.position.copy(pos);
    mesh.position.y += 1.25;
    scene.add(mesh);
    effects.push({ mesh, life: 1.0, maxLife: 1.0 });
  }

  function updateEffects(dt) {
    effects = effects.filter(e => {
      e.life -= dt;
      const p = 1 - e.life / e.maxLife;
      e.mesh.scale.setScalar(0.6 + p * 0.8);
      e.mesh.material.opacity = Math.max(0, e.life / e.maxLife) * 0.9;
      e.mesh.rotation.y += dt * 2.2;
      if (e.life <= 0) {
        e.mesh.geometry.dispose();
        e.mesh.material.dispose();
        scene.remove(e.mesh);
        return false;
      }
      return true;
    });
  }

  const behaviorWeights = { fight: 30, flee: 40, communicate: 30 };

  function resolveEncounter(a, b) {
    const total = behaviorWeights.fight + behaviorWeights.flee + behaviorWeights.communicate;
    const roll = Math.random() * (total || 1);
    let type;
    if (roll < behaviorWeights.fight) type = 'fight';
    else if (roll < behaviorWeights.fight + behaviorWeights.flee) type = 'flee';
    else type = 'communicate';

    const mid = new THREE.Vector3().addVectors(a.position, b.position).multiplyScalar(0.5);

    if (type === 'fight') {
      a.userData.state = 'encounter'; a.userData.encTimer = 1.0;
      b.userData.state = 'encounter'; b.userData.encTimer = 1.0;
      spawnEffect(mid, 'fight');
    } else if (type === 'communicate') {
      a.userData.state = 'encounter'; a.userData.encTimer = 1.2;
      b.userData.state = 'encounter'; b.userData.encTimer = 1.2;
      spawnEffect(mid, 'communicate');
    } else {
      const fleer = Math.random() < 0.5 ? a : b;
      const other = fleer === a ? b : a;
      const fleerGrid = worldToGrid(fleer.position.x, fleer.position.z);
      const fromCell = nearestFloorCell(fleerGrid.gx, fleerGrid.gz);
      const threatCell = worldToGrid(other.position.x, other.position.z);
      const target = pickFleeTarget(threatCell);
      const path = findPath(fromCell, target);
      if (path && path.length > 1) {
        fleer.userData.path = path.slice(1).map(cell => gridToWorld(cell.gx, cell.gz));
        fleer.userData.state = 'fleeing';
        fleer.userData.fleeTimer = rand(1.8, 2.8);
      }
      other.userData.state = 'encounter'; other.userData.encTimer = 0.4;
      spawnEffect(fleer.position, 'flee');
    }
    a.userData.encounterCooldown = 3;
    b.userData.encounterCooldown = 3;
  }

  const ENCOUNTER_RADIUS = 1.1;
  function checkEncounters(dt) {
    for (let i = 0; i < critters.length; i++) {
      const a = critters[i];
      const da = a.userData;
      if (da.encounterCooldown > 0 || da.state === 'encounter') continue;
      for (let j = i + 1; j < critters.length; j++) {
        const b = critters[j];
        const db = b.userData;
        if (db.encounterCooldown > 0 || db.state === 'encounter') continue;
        if (a.position.distanceTo(b.position) < ENCOUNTER_RADIUS) {
          resolveEncounter(a, b);
          break;
        }
      }
    }
    critters.forEach(c => { if (c.userData.encounterCooldown > 0) c.userData.encounterCooldown -= dt; });
  }

  function updateFacing(d, nx, nz, dt) {
    const targetAngle = Math.atan2(nx, nz);
    let diff = targetAngle - d.facing;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    d.facing += diff * Math.min(1, dt * 8);
  }

  function followPath(c, d, dt, speedMul) {
    const wp = d.path[0];
    const dx = wp.x - c.position.x, dz = wp.z - c.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.12) {
      d.path.shift();
    } else {
      const nx = dx / dist, nz = dz / dist;
      c.position.x += nx * d.speed * speedMul * dt;
      c.position.z += nz * d.speed * speedMul * dt;
      updateFacing(d, nx, nz, dt);
    }
  }

  // ================= camera =================
  let camAngle = 0.6, camRadius = 27, camHeight = 23;
  let autoSpin = true, dragging = false, lastX = 0;

  function updateCamera() {
    camera.position.set(Math.cos(camAngle) * camRadius, camHeight, Math.sin(camAngle) * camRadius);
    camera.lookAt(0, 0.6, 0);
  }
  updateCamera();

  renderer.domElement.style.touchAction = 'none';
  renderer.domElement.addEventListener('pointerdown', e => { dragging = true; autoSpin = false; lastX = e.clientX; });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    camAngle -= dx * 0.006;
  });
  window.addEventListener('pointerup', () => { dragging = false; });
  renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    camRadius = clamp(camRadius + e.deltaY * 0.02, 14, 44);
  }, { passive: false });

  // ================= UI wiring =================
  let desiredCount = 8;
  function bindSlider(id, valId, onChange) {
    const el = document.getElementById(id), valEl = document.getElementById(valId);
    el.addEventListener('input', () => { valEl.textContent = el.value; onChange(Number(el.value)); });
  }
  bindSlider('countSlider', 'countVal', v => { desiredCount = v; });
  bindSlider('fightSlider', 'fightVal', v => { behaviorWeights.fight = v; });
  bindSlider('fleeSlider', 'fleeVal', v => { behaviorWeights.flee = v; });
  bindSlider('talkSlider', 'talkVal', v => { behaviorWeights.communicate = v; });
  document.getElementById('regen').addEventListener('click', () => buildWorld(desiredCount));

  // ================= main loop =================
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    if (autoSpin) camAngle += dt * 0.05;
    updateCamera();
    checkEncounters(dt);
    updateEffects(dt);

    critters.forEach(c => {
      const d = c.userData;
      if (d.state === 'idle') {
        d.timer -= dt;
        if (d.timer <= 0) {
          const startRaw = worldToGrid(c.position.x, c.position.z);
          const startCell = nearestFloorCell(startRaw.gx, startRaw.gz);
          const goalCell = pick(floorCells);
          const path = findPath(startCell, goalCell);
          if (path && path.length > 1) {
            d.path = path.slice(1).map(cell => gridToWorld(cell.gx, cell.gz));
            d.state = 'walking';
          } else {
            d.timer = rand(0.3, 0.7);
          }
        }
      } else if (d.state === 'walking') {
        if (d.path.length === 0) { d.state = 'idle'; d.timer = rand(0.6, 2.2); }
        else {
          followPath(c, d, dt, 1);
          if (d.path.length === 0) { d.state = 'idle'; d.timer = rand(0.6, 2.2); }
        }
      } else if (d.state === 'fleeing') {
        d.fleeTimer -= dt;
        if (d.path.length === 0 || d.fleeTimer <= 0) { d.state = 'idle'; d.timer = rand(0.4, 1.0); }
        else followPath(c, d, dt, 1.7);
      } else if (d.state === 'encounter') {
        d.encTimer -= dt;
        if (d.encTimer <= 0) { d.state = 'idle'; d.timer = rand(0.3, 1.0); }
      }

      c.rotation.y = d.facing;
      const moving = d.state === 'walking' || d.state === 'fleeing';
      const wave = Math.abs(Math.sin(t * 8 + d.bobPhase));
      const bob = moving ? wave * 0.08 : Math.sin(t * 1.6 + d.bobPhase) * 0.02;
      c.position.y = bob;
      const squash = moving ? 0.94 + 0.06 * wave : 1;
      c.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
    });

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
