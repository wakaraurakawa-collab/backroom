<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜の学校(仮)</title>
<style>
  :root {
    --bg: #070c09;
    --panel: #0d1510;
    --panel2: #121d16;
    --ink: #c8d8cc;
    --dim: #74857a;
    --glow: #7fd8b0;
    --glow-dim: #3d6b55;
    --danger: #d97f7f;
    --warn: #d8c37f;
    --line: #23342a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "BIZ UDMincho", serif;
    font-size: 14px;
  }
  button {
    font-family: inherit; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover:not(:disabled) { border-color: var(--glow-dim); color: var(--glow); }
  button:disabled { opacity: 0.35; cursor: default; }
  .screen { position: fixed; inset: 0; overflow: auto; }
  [hidden] { display: none !important; }

  /* ---------- title ---------- */
  #screen-title { display: flex; flex-direction: column; align-items: center; padding: 28px 16px; gap: 18px; }
  #screen-title h1 {
    font-size: 34px; letter-spacing: 0.35em; color: var(--glow);
    text-shadow: 0 0 18px rgba(127, 216, 176, 0.35); font-weight: 500;
  }
  #screen-title .sub { color: var(--dim); letter-spacing: 0.2em; font-size: 12px; text-align: center; line-height: 1.9; }
  .char-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 1080px; }
  .char-card {
    width: 225px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .char-card:hover { border-color: var(--glow-dim); }
  .char-card.sel { border-color: var(--glow); box-shadow: 0 0 16px rgba(127, 216, 176, 0.22); }
  .char-card .cportrait { width: 100%; border-radius: 6px; overflow: hidden; background: #050807; }
  .char-card .cportrait svg { display: block; width: 100%; height: auto; }
  .char-card h3 { font-size: 16px; color: var(--glow); font-weight: 500; }
  .char-card .cdesc { color: var(--dim); font-size: 11px; min-height: 30px; }
  .char-card .cstats { font-size: 12px; line-height: 1.6; }
  .char-card .cab { font-size: 11px; color: var(--warn); }
  .diff-row { display: flex; gap: 10px; }
  .diff-row button.sel { border-color: var(--glow); color: var(--glow); }
  #startBtn { font-size: 16px; padding: 12px 46px; letter-spacing: 0.3em; }

  /* ---------- game layout ---------- */
  #screen-game { display: flex; }
  #board-wrap {
    flex: 1; position: relative; overflow: hidden; cursor: grab;
    background: radial-gradient(ellipse at 50% 40%, rgba(127,216,176,0.05), transparent 60%), var(--bg);
  }
  #board-wrap:active { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .room {
    position: absolute; width: 120px; height: 120px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    user-select: none; overflow: hidden;
  }
  .room .rart { position: absolute; inset: 0; opacity: 0.8; }
  .room .rart svg { width: 100%; height: 100%; }
  .room .rname {
    position: relative; font-size: 13px; letter-spacing: 0.15em; padding: 3px 0 6px;
    text-shadow: 0 0 6px #000;
  }
  .room.cur { border-color: var(--glow); box-shadow: 0 0 18px rgba(127, 216, 176, 0.25); }
  .room.warped { border-color: #4a3d6b; }

  #marker {
    position: absolute; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #dff5e8, var(--glow) 60%, var(--glow-dim));
    box-shadow: 0 0 14px rgba(127, 216, 176, 0.8);
    display: flex; align-items: center; justify-content: center;
    color: #0a221a; font-size: 13px; font-weight: 700;
    pointer-events: none; transition: left 0.35s ease, top 0.35s ease; z-index: 5;
  }

  /* ---------- offers (three cards) ---------- */
  #offers {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 10;
  }
  .offer {
    width: 150px; background: rgba(13, 21, 16, 0.94); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; gap: 5px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .offer:hover:not(.blocked) { border-color: var(--glow); transform: translateY(-4px); }
  .offer .odir { font-size: 11px; color: var(--dim); letter-spacing: 0.3em; }
  .offer .oart { height: 74px; border-radius: 6px; overflow: hidden; background: #050807; }
  .offer .oart svg { width: 100%; height: 100%; }
  .offer .oname { font-size: 14px; letter-spacing: 0.1em; }
  .offer .ohint { font-size: 11px; min-height: 15px; color: var(--warn); }
  .offer.blocked { cursor: default; opacity: 0.6; }
  .offer.blocked .oname { color: var(--danger); font-size: 12px; }

  /* ---------- side panel ---------- */
  #side {
    width: 310px; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 12px; gap: 9px; overflow-y: auto;
  }
  #pHead { display: flex; gap: 10px; align-items: center; }
  #pPortrait { width: 62px; border-radius: 6px; overflow: hidden; background: #050807; flex: none; }
  #pPortrait svg { display: block; width: 100%; height: auto; }
  #side h2 { font-size: 15px; color: var(--glow); font-weight: 500; letter-spacing: 0.08em; }
  .pips { letter-spacing: 3px; font-size: 15px; }
  .pips .on { color: var(--glow); }
  .pips.hp .on { color: var(--danger); }
  .pips .off { color: #2a382f; }
  .srow { display: flex; justify-content: space-between; font-size: 13px; align-items: center; }
  .srow .lbl { color: var(--dim); }
  #phaseBar { height: 6px; background: #1a241e; border-radius: 999px; overflow: hidden; }
  #phaseFill { height: 100%; background: linear-gradient(90deg, var(--glow-dim), var(--glow)); width: 0%; }
  #phaseName { font-size: 12px; color: var(--warn); letter-spacing: 0.2em; }
  #followLine { font-size: 11px; color: var(--danger); min-height: 14px; }

  #goalBox { display: flex; gap: 6px; }
  .goal {
    flex: 1; text-align: center; font-size: 11px; padding: 5px 2px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
  }
  .goal.done { color: var(--glow); border-color: var(--glow-dim); }

  #itemBox { display: flex; flex-direction: column; gap: 5px; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 12px; gap: 6px;
  }
  .item .idesc { color: var(--dim); font-size: 11px; }
  .item button { padding: 2px 8px; font-size: 11px; flex: none; }

  #actionBox { display: flex; gap: 6px; }
  #actionBox button { flex: 1; }

  #encBox, #stuBox {
    border: 1px solid #4a3030; background: #170f0f; border-radius: 8px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #stuBox { border-color: #33424a; background: #0e1416; }
  #encBox .ename { color: var(--danger); font-size: 15px; letter-spacing: 0.15em; }
  #encBox .eline, #stuBox .sline { color: var(--dim); font-size: 12px; line-height: 1.7; }
  #stuBox .stop { display: flex; gap: 10px; }
  #stuBox .sportrait { width: 74px; flex: none; border-radius: 6px; overflow: hidden; background: #050807; }
  #stuBox .sportrait svg { display: block; width: 100%; height: auto; }
  #stuBox .sname { font-size: 14px; color: var(--glow); }
  #stuBox .sinfo { font-size: 11px; color: var(--dim); line-height: 1.8; }

  #log {
    flex: 1; min-height: 110px; overflow-y: auto; font-size: 12px; line-height: 1.75;
    border-top: 1px solid var(--line); padding-top: 8px; color: var(--dim);
  }
  #log .l-good { color: var(--glow); }
  #log .l-bad { color: var(--danger); }
  #log .l-warn { color: var(--warn); }
  #log .l-roll { color: #8fa3b8; }

  /* ---------- result ---------- */
  #screen-result {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 20px;
  }
  #resultTitle { font-size: 30px; letter-spacing: 0.3em; color: var(--glow); font-weight: 500; }
  #resultTitle.bad { color: var(--danger); }
  #resultBody { color: var(--dim); line-height: 2; max-width: 560px; }
  #resultStats { font-size: 13px; color: var(--ink); line-height: 1.9; }
  #resultLog {
    width: min(680px, calc(100vw - 40px)); max-height: 34vh; overflow-y: auto;
    text-align: left; font-size: 12px; line-height: 1.8; color: var(--dim);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  #resultLog .l-good { color: var(--glow); }
  #resultLog .l-bad { color: var(--danger); }
  #resultLog .l-warn { color: var(--warn); }
  #resultLog .l-roll { color: #8fa3b8; }
  #copyRow { display: flex; gap: 10px; align-items: center; }
  #copyFb { font-size: 12px; color: var(--glow); }

  /* ---------- intro (tonight's rules) ---------- */
  #introBox {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(460px, calc(100% - 32px));
    background: rgba(10, 16, 12, 0.96); border: 1px solid var(--glow-dim);
    border-radius: 12px; padding: 20px 22px; z-index: 20;
    box-shadow: 0 0 40px rgba(127, 216, 176, 0.15);
    display: flex; flex-direction: column; gap: 10px;
  }
  #introBox h3 { color: var(--glow); font-size: 17px; letter-spacing: 0.25em; font-weight: 500; text-align: center; }
  #introBox .rule { font-size: 13px; line-height: 1.9; color: var(--ink); }
  #introBox .rule .dim { color: var(--dim); }
  #introBox .glist { display: flex; flex-direction: column; gap: 5px; }
  #introBox .gitem {
    display: flex; justify-content: space-between; font-size: 13px;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  }
  #introBox .gitem .where { color: var(--warn); font-size: 12px; }
</style>
</head>
<body>

<div class="screen" id="screen-title">
  <h1>夜の学校</h1>
  <div class="sub">夕方以降、別世界の教室につながる廊下が現れる。<br>
    帰り支度——上履き・かばん・昇降口の鍵——を揃えて、夜明けを迎えること。</div>
  <div class="char-row" id="charRow"></div>
  <div class="diff-row" id="diffRow"></div>
  <button id="startBtn">入 校</button>
  <div class="sub">うしろから、なにか付いてきている。来た道には戻れない。</div>
</div>

<div class="screen" id="screen-game" hidden>
  <div id="board-wrap">
    <div id="board"></div>
    <div id="offers"></div>
    <div id="introBox" hidden></div>
  </div>
  <aside id="side">
    <div id="pHead">
      <div id="pPortrait"></div>
      <div style="flex:1">
        <h2 id="pName"></h2>
        <div class="srow"><span class="lbl">体力</span><span class="pips hp" id="hpPips"></span></div>
        <div class="srow"><span class="lbl">正気度</span><span class="pips" id="mpPips"></span></div>
      </div>
    </div>
    <div class="srow"><span class="lbl">腕力 / 敏捷 / 直感</span><span id="statLine"></span></div>
    <div class="srow"><span class="lbl">現在地</span><span id="hereName"></span></div>
    <div>
      <div class="srow"><span class="lbl">夜明けまで</span><span id="turnLine"></span></div>
      <div id="phaseBar"><div id="phaseFill"></div></div>
      <div class="srow"><span id="phaseName"></span><span id="followLine"></span></div>
    </div>
    <div>
      <div class="srow"><span class="lbl">帰り支度</span></div>
      <div id="goalBox"></div>
    </div>
    <div id="actionBox"></div>
    <div id="encBox" hidden></div>
    <div id="stuBox" hidden></div>
    <div>
      <div class="srow"><span class="lbl">持ち物 (最大4)</span></div>
      <div id="itemBox"></div>
    </div>
    <div id="log"></div>
  </aside>
</div>

<div class="screen" id="screen-result" hidden>
  <div id="resultTitle"></div>
  <div id="resultBody"></div>
  <div id="resultStats"></div>
  <div id="resultLog"></div>
  <div id="copyRow">
    <button id="copyLogBtn">今夜の記録をコピー</button>
    <span id="copyFb"></span>
    <button id="againBtn">もう一度、あの夜へ</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const rand = (a, b) => Math.random() * (b - a) + a;
  const ri = (a, b) => Math.floor(rand(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function weightedPick(list, wOf) {
    let total = 0;
    for (const it of list) total += wOf(it);
    let r = Math.random() * total;
    for (const it of list) { r -= wOf(it); if (r < 0) return it; }
    return list[list.length - 1];
  }

  // ================= placeholder art (SVG) =================
  // 厚塗り・緑の影・フラッシュ白飛び風の"仮"アセット。本番絵に差し替え可能なスロット。

      </radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="1.6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>`;

  const HAIR_BACK = [
    'M34,44 Q60,14 86,44 L90,128 L72,112 L60,122 L48,112 L30,128 Z',            // 長いストレート

    'M34,46 Q60,16 86,46 L88,84 Q60,98 32,84 Z M28,60 L20,118 L34,110 Z M92,60 L100,118 L86,110 Z', // ツイン

  ];
  const HAIR_COLORS = ['#191d1b', '#241c16', '#3a2b1c', '#4a3b23', '#5c5140', '#2a2430'];

  function portraitSVG(p) {
    // p: { hair: 0-5, hairColor, blonde? } — バストアップ、瞳が薄く発光
    const hc = p.hairColor;
    return `<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
      ${SVG_DEFS}
      <rect width="120" height="150" fill="#0a120d"/>

      <path d="M80,54 Q72,44 60,46 Q68,56 72,62 Z" fill="${hc}" opacity="0.9"/>
      <g filter="url(#glow)">
        <ellipse cx="52" cy="66" rx="3.4" ry="4.6" fill="#9fe8c8"/>

      </g>
      <circle cx="52.8" cy="64.6" r="1" fill="#fff"/>
      <circle cx="68.8" cy="64.6" r="1" fill="#fff"/>
      <rect width="120" height="150" fill="url(#flash)"/>
    </svg>`;
  }

  const ROOM_ART = {
    genkan:  '<rect x="26" y="14" width="68" height="52" rx="2"/><line x1="26" y1="31" x2="94" y2="31"/><line x1="26" y1="48" x2="94" y2="48"/><line x1="49" y1="14" x2="49" y2="66"/><line x1="72" y1="14" x2="72" y2="66"/>',
    roka:    '<line x1="8" y1="72" x2="60" y2="26"/><line x1="112" y1="72" x2="60" y2="26"/><rect x="30" y="38" width="10" height="18"/><rect x="80" y="38" width="10" height="18"/><line x1="8" y1="30" x2="42" y2="28"/><line x1="112" y1="30" x2="78" y2="28"/>',

    kaidan:  '<polyline points="16,68 34,68 34,54 52,54 52,40 70,40 70,26 88,26 88,12 104,12"/>',

    hoken:   '<rect x="20" y="40" width="56" height="20"/><rect x="24" y="30" width="16" height="10"/><line x1="94" y1="18" x2="94" y2="38"/><line x1="84" y1="28" x2="104" y2="28"/>',

    rika:    '<path d="M54,14 L54,34 L38,62 Q36,68 44,68 L76,68 Q84,68 82,62 L66,34 L66,14"/><line x1="48" y1="14" x2="72" y2="14"/><circle cx="56" cy="56" r="3"/><circle cx="66" cy="50" r="2"/>',
    ongaku:  '<rect x="20" y="40" width="80" height="24"/><line x1="32" y1="40" x2="32" y2="58"/><line x1="44" y1="40" x2="44" y2="58"/><line x1="56" y1="40" x2="56" y2="58"/><line x1="68" y1="40" x2="68" y2="58"/><line x1="80" y1="40" x2="80" y2="58"/><line x1="92" y1="40" x2="92" y2="58"/><circle cx="84" cy="22" r="5"/><line x1="89" y1="22" x2="89" y2="6"/>',
    taiiku:  '<circle cx="60" cy="40" r="26"/><line x1="60" y1="14" x2="60" y2="66"/><circle cx="88" cy="58" r="8"/>',
    toilet:  '<rect x="30" y="14" width="26" height="34"/><ellipse cx="80" cy="52" rx="16" ry="8"/><line x1="80" y1="30" x2="80" y2="44"/><path d="M36,20 L50,42" opacity="0.5"/>',

  function phase() {
    const p = S.turn / S.diff.turns;
    for (let i = 0; i < PHASES.length; i++) if (p < PHASES[i].until) return { ...PHASES[i], idx: i };

  function statOf(kind) {
    const base = kind === 'str' ? S.char.str : kind === 'agi' ? S.char.agi : S.char.int;
    let bonus = 0;
    for (const it of S.items) if (it.type === 'passive' && it.stat === kind) bonus++;
    return base + bonus;
  }

  function check(kind, target, label) {
    const st = statOf(kind);
    const d1 = ri(1, 6), d2 = ri(1, 6);
    const total = d1 + d2 + st;
    const ok = total >= target;
    log(`${label} — 2d6(${d1}+${d2})+${st} = ${total} / 目標${target} … ${ok ? '成功' : '失敗'}`, 'l-roll');
    if (!ok) {
      const oi = S.items.findIndex(it => it.key === 'omamori');
      if (oi !== -1) {
        S.items.splice(oi, 1);
        S.omamoriUsed++;
        log('お守りが、音もなく砕けた。悪いものが逸れていく。', 'l-good');
        return true;
      }
    }
    return ok;
  }

  function damage(fx) {
    if (fx.hp) { S.hp -= fx.hp; log(`体力が ${fx.hp} 削られた。`, 'l-bad'); }

    checkDead();

    if (S.over) return;

      // 詰み防止: 夜が深いのに鍵が無いなら職員室が現れやすくなる
      if (r.key === 'shokuin' && !S.goals.key && S.turn / S.diff.turns > 0.25) w += 8;
      // 夜半を過ぎたら、まだ見つかっていないさがしものの部屋も少し現れやすく
      if (S.turn / S.diff.turns > 0.5) {
        for (const g of S.activeGoals) if (!S.goals[g.key] && g.rooms.includes(r.key)) { w += 3; break; }
      }
      // ノート/屋上の効果: 足りない帰り支度の部屋が現れやすい
      if (S.goalSense > 0) {
        for (const g of S.activeGoals) if (!S.goals[g.key] && g.rooms.includes(r.key)) { w *= 2; break; }
      }
      return w;
    });
  }
  function preRollEvent(type) {
    const w = { ...type.eventW };
    w.enemy = Math.round(w.enemy * phase().encMul * S.diff.encMul);
    return weightedPick(Object.keys(w), k => w[k]);
  }

  function makeOffers() {
    const dirs = [['左', LEFT_OF[S.facing]], ['前', S.facing], ['右', RIGHT_OF[S.facing]]];
    S.offers = [];
    let allBlocked = true;
    for (const [label, abs] of dirs) {
      const [dx, dy] = DIRS[abs];
      if (cellAt(S.pos.x + dx, S.pos.y + dy)) {
        S.offers.push({ label, abs, blocked: true });
      } else {
        allBlocked = false;
        const type = drawRoomType();
        S.offers.push({ label, abs, blocked: false, type, evKind: preRollEvent(type), revealed: S.peekBuff });
      }
    }
    S.peekBuff = false;
    if (allBlocked) {
      // 自分の軌跡に囲まれた: 校舎が組み変わり、少し先の空き地点へ
      log('三方から、足音。……壁が、頁をめくるように捲れた。', 'l-warn');
      const [fx, fy] = DIRS[S.facing];
      let placed = false;
      for (let step = 2; step <= 8 && !placed; step++) {
        const nx = S.pos.x + fx * step, ny = S.pos.y + fy * step;
        if (!cellAt(nx, ny)) {
          S.map.set(key(nx, ny), { x: nx, y: ny, room: { key: 'yuganda', name: '歪んだ廊下', warped: true }, searched: false });
          S.pos = { x: nx, y: ny };
          S.roomsExplored++;
          placed = true;
        }
      }
      if (!placed) {
        // ほぼ起こらないが保険: どこか空いている隣接を探して全マップ走査
        outer: for (let r = 1; r < 30; r++) {
          for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
            const nx = S.pos.x + dx, ny = S.pos.y + dy;
            if (!cellAt(nx, ny)) {
              S.map.set(key(nx, ny), { x: nx, y: ny, room: { key: 'yuganda', name: '歪んだ廊下', warped: true }, searched: false });
              S.pos = { x: nx, y: ny };
              S.roomsExplored++;
              break outer;
            }
          }
        }
      }
      makeOffers();
    }
  }

  function chooseOffer(idx) {
    if (S.over || S.enc || S.student || S.intro) return;
    const o = S.offers[idx];
    if (!o || o.blocked) return;
    const [dx, dy] = DIRS[o.abs];
    const nx = S.pos.x + dx, ny = S.pos.y + dy;
    const cell = { x: nx, y: ny, room: o.type, searched: false };
    S.map.set(key(nx, ny), cell);
    S.roomsExplored++;
    S.pos = { x: nx, y: ny };
    S.facing = o.abs;
    S.stays = 0;
    S.chalk = false;
    S.pendingEnd = true;
    log(`${o.label}の扉へ。—— ${o.type.name}。`);
    roomArrival(cell, o.evKind);
    completeTurn();
    centerOnPlayer(true);
  }

  function roomArrival(cell, evKind) {
    const rk = cell.room.key;
    if (rk === 'watari' && !S.flagWatari) { S.flagWatari = true; heal(0, 1); log('渡り廊下。外の月が見えた。すこし息がつける。正気度+1', 'l-good'); }
    if (rk === 'roka') { S.peekBuff = true; log('見通しのいい廊下だ。この先の気配が読めそうだ。', 'l-good'); }
    if (rk === 'kaidan' && Math.random() < 0.15) { S.skipTick = true; log('階段が、行きたい方に繋がっていた。近道だ。(ターンを消費しない)', 'l-good'); }
    if (rk === 'okujou') {
      heal(0, 2);
      log('屋上。夜風。空の底が少しだけ白い。正気度+2', 'l-good');
      goalHint();
      S.goalSense = Math.max(S.goalSense, 4);
    }
    // 到着イベント
    if (evKind === 'none') log(pick(FLAVOR));
    else if (evKind === 'item') giveRoomItem(rk);
    else if (evKind === 'enemy') startEncounter(rk);
    else if (evKind === 'student') studentEvent();
    else hazardEvent(rk);
  }

  function goalHint() {
    const missing = S.activeGoals.filter(g => !S.goals[g.key]);
    if (!missing.length) { log('帰り支度は、もう揃っている。あとは朝を待つだけ。', 'l-good'); return; }
    for (const g of missing) {
      const names = g.rooms.map(k => roomByKey(k).name).join('・');
      log(`【視えた】${g.name} は ${names} にある。`, 'l-warn');
    }
  }

  // ================= events =================
  function studentEvent() {
    const stu = genStudent();
    // 一定割合で、様子のおかしい生徒が襲いかかってくる
    if (Math.random() < 0.18) {
      S.enc = {
        key: 'stuHostile', name: `${stu.surname} ${stu.given}`,
        line: `${stu.grade}年${stu.classNo}組、と名乗った。目が合ったまま、笑顔のまま、走ってくる。`,
        fight: 7, flee: 7, hide: 8, failFx: { hp: 1, mp: 1 },
        isStudent: true, look: stu.look,
        staggered: false, rounds: 0,
      };
      log(`【遭遇】 生徒 —— ${stu.surname} ${stu.given}`, 'l-bad');
      log(S.enc.line);
      renderAll();
      return;
    }
    const ev = weightedPick(STUDENT_EVENTS, e => e.w);
    S.student = { stu, ev };
    // 矛盾チェック: 同じ学年・組なのに上履きの色が違う
    const clash = S.metStudents.find(m => m.grade === stu.grade && m.classNo === stu.classNo && m.shoe !== stu.shoe);
    S.student.clash = !!clash;
    S.metStudents.push({ grade: stu.grade, classNo: stu.classNo, shoe: stu.shoe });
    renderAll();
  }

  function dismissStudent() {
    if (!S.student) return;
    const { stu, ev, clash } = S.student;
    S.student = null;
    log(`${stu.surname} ${stu.given}(${stu.grade}-${stu.classNo})と別れた。`);
    log(ev.line);
    if (ev.item) giveItem();
    if (ev.hint) goalHint();
    if (ev.mp > 0) { heal(0, ev.mp); log('正気度が少し戻った。', 'l-good'); }
    if (ev.mp < 0) damage({ mp: -ev.mp });
    if (clash && !S.over) log('……あの子、同じクラスの子と上履きの色が違った。同じ年の生徒の色は、揃うはずなのに。', 'l-warn');
    completeTurn();
  }

  function hazardEvent(rk) {
    let hz = pick(HAZARDS);
    if (rk === 'kaidan') hz = HAZARDS[4];
    log(`【${hz.name}】 ${hz.line}`, 'l-warn');
    if (!check(hz.stat, hz.target, '回避')) damage(hz.failFx);
    else log('なんとかやり過ごした。');
  }

  function startEncounter(roomKey) {
    let e;
    if (roomKey && ROOM_ENEMY[roomKey] && Math.random() < 0.6) e = ENEMIES.find(x => x.key === ROOM_ENEMY[roomKey]);
    else e = pick(ENEMIES);
    S.enc = { ...e, staggered: false, rounds: 0 };
    log(`【遭遇】 ${e.name}`, 'l-bad');
    log(e.line);
  }

  function startFollower() {
    S.enc = { ...FOLLOWER, staggered: false, rounds: 0 };
    log('【追いつかれた】 ' + FOLLOWER.name, 'l-bad');
    log(FOLLOWER.line);
    log('これに勝つ方法は、ない。走るしかない。', 'l-bad');
  }

  function hasWeapon() {
    return S.items.some(it => it.type === 'passive' && it.stat === 'str');
  }

  // 遭遇中に取れる行動の一覧。素手では押しのけるだけ、武器があれば応戦できる。
  // 応戦は倒すためではなく怯ませるため——怯んだ相手には確実に逃げられるし、
  // もう一撃入れば撃退もできる。
  function encActions() {
    const e = S.enc;
    if (!e) return [];
    const acts = [];
    if (e.fight !== null) {
      acts.push({ k: 'shove', label: '押しのける', stat: 'str', target: e.fight + 1, escape: true });
      if (hasWeapon()) {
        acts.push({ k: 'weapon', label: e.staggered ? '追撃する' : '武器で応戦', stat: 'str',
          target: e.staggered ? e.fight - 2 : e.fight, escape: false });
      }
    }
    if (e.flee !== null) acts.push({ k: 'flee', label: '逃げる', stat: 'agi', target: e.flee, escape: true, auto: e.staggered });
    if (e.hide !== null) acts.push({ k: 'hide', label: '隠れる', stat: 'int', target: e.hide, escape: true });
    return acts;
  }

  function defeatEnemy(e) {
    if (e.isStudent) {
      log(`${e.name}は泣きそうな顔になって、走り去っていった。`, 'l-good');
      S.mp -= 1;
      log('……悪いことをした気分だ。正気度-1', 'l-bad');
      checkDead();
      if (!S.over && Math.random() < 0.5) { log('落としていったものがある。'); giveItem(); }
    } else {
      log(`${e.name}を打ち払った。——今夜はもう、戻ってこない気がする。`, 'l-good');
      heal(0, 1);
      log('正気度+1', 'l-good');
      if (S.char.ability === 'fighter') { heal(0, 1); log('澪「……なんだ、大したことないじゃん」 正気度+1', 'l-good'); }
      if (Math.random() < 0.3) giveItem();
    }
  }

  function resolveEncounter(k) {
    const e = S.enc;
    if (!e) return;
    const act = encActions().find(a => a.k === k);
    if (!act) return;
    let ok;
    if (act.auto) {
      ok = true;
      log('相手が怯んでいる隙に、走った。', 'l-roll');
    } else {
      ok = check(act.stat, act.target, act.label);
    }
    if (ok) {
      if (k === 'weapon') {
        if (e.staggered) {
          S.enc = null;
          defeatEnemy(e);
          completeTurn();
          return;
        }
        e.staggered = true;
        log(`一撃。${e.name} が怯んだ。——今なら確実に逃げられる。追撃もできる。`, 'l-good');
        renderAll();
        return;
      }
      S.enc = null;
      if (k === 'shove') log('体当たり気味に押しのけて、その横をすり抜けた。', 'l-good');
      else if (k === 'flee') {
        log('走った。来た道には戻れない——柱の陰に逸れて、やり過ごす。', 'l-good');
        if (S.char.ability === 'runner') { heal(0, 1); log('ひな「陸上部なめないでよね!」 正気度+1', 'l-good'); }
        if (e.follower) { S.stays = 0; log('振り切った。……今は。', 'l-warn'); }
      }
      else log('息を殺す。……行った、みたいだ。', 'l-good');
      completeTurn();
      return;
    }
    // 失敗
    if (e.follower) { endGame('caught'); return; }
    const deep = phase().idx >= 2;
    const fx = { ...e.failFx };
    if (deep) { if (fx.hp) fx.hp += 1; else if (fx.mp) fx.mp += 1; }
    damage(fx);
    if (S.over) return;
    e.rounds++;
    if (e.rounds >= 3) {
      S.enc = null;
      S.mp -= 1;
      log('それは、飽きたように離れていった。膝が笑っている。正気度-1', 'l-bad');
      checkDead();
      completeTurn();
      return;
    }
    log('まだ、そこにいる。', 'l-bad');
    renderAll();
  }

  // ================= actions in place =================
  function stayRisk() {
    if (S.chalk) return 0;
    return (0.24 + 0.10 * S.stays) * phase().encMul * S.diff.encMul;
  }

  function doRest(kind) {
    if (S.over || S.enc || S.student || S.intro) return;
    const cur = here();
    S.stays++;
    if (kind === 'hp') {
      const amount = cur.room.key === 'hoken' ? 2 : 1;
      heal(amount, 0);
      log(cur.room.key === 'hoken' ? '保健室のベッドで手当てをした。体力+2' : '手当てをした。体力+1', 'l-good');
    } else {
      heal(0, 1);
      log('深呼吸。まだ大丈夫。正気度+1', 'l-good');
    }
    S.pendingEnd = true;
    if (!checkFollower() && Math.random() < stayRisk()) {
      log('——物音。うしろの気配が、近い。', 'l-warn');
      startEncounter(cur.room.key);
    }
    completeTurn();
  }

  // 留まりすぎると、うしろのものに追いつかれる。チョークの結界も効かない。
  function checkFollower() {
    if (S.stays < 3) return false;
    if (Math.random() < 0.25 * (S.stays - 2)) { startFollower(); return true; }
    return false;
  }

  function doSearch() {
    if (S.over || S.enc || S.student || S.intro) return;
    const cur = here();
    const rk = cur.room.key;
    S.stays++;
    S.pendingEnd = true;
    if (checkFollower()) { completeTurn(); return; }

    // 帰り支度の発見判定を先に(粘れば同じ部屋で探し続けられる。その分、背後の気配は近づく)
    const goal = S.activeGoals.find(g => !S.goals[g.key] && g.rooms.includes(rk));
    if (goal && Math.random() < goal.p + (S.char.ability === 'observe' ? 0.1 : 0)) {
      cur.searched = true;
      S.goals[goal.key] = true;
      log(`${goal.find}【帰り支度: ${goal.name}】`, 'l-good');
      if (S.activeGoals.every(g2 => S.goals[g2.key])) log('帰り支度が、そろった。あとは夜明けまで。', 'l-warn');
      completeTurn();
      return;
    }

    let itemP = cur.searched ? 0.10 : 0.42;
    if (rk === 'tosho' || rk === 'kateika' || rk === 'bushitsu') itemP += 0.13;
    if (S.char.ability === 'observe') itemP += 0.12;
    cur.searched = true;
    const r = Math.random();
    if (r < itemP) {
      if (rk === 'bushitsu') bushitsuGacha();
      else if (rk === 'tosho' && Math.random() < 0.4) { log('貸出カードの束の中に、まだ新しい書き込み。', 'l-warn'); goalHint(); }
      else giveRoomItem(rk);
    } else if (!S.chalk && r < itemP + 0.20 * phase().encMul) {
      log('探しものをしていて、気づくのが遅れた。', 'l-warn');
      startEncounter(rk);
    } else {
      log(pick(FLAVOR));
    }
    completeTurn();
  }

  function bushitsuGacha() {
    const club = pick(['undo', 'bunka', 'okaruto']);
    if (club === 'undo') { log('運動部の部室だ。道具がいろいろ転がっている。'); giveItem(pick(['shinai', 'mop', 'shoes2'])); }
    else if (club === 'bunka') { log('文化部の部室だ。作業机の上に、置き忘れ。'); giveItem(pick(['camera', 'ramune', 'chalk', 'light'])); }
    else {
      log('オカルト研究会、と札が出ている。中央の机に、箱がひとつ。', 'l-warn');
      S.mp -= 1;
      log('開けた。……見なければよかった。正気度-1', 'l-bad');
      checkDead();
      if (!S.over) giveItem(pick(['watch', 'photo', 'note', 'omamori']));
    }
  }

  function useItem(idx) {
    if (S.over || S.student || S.intro) return;
    const it = S.items[idx];
    if (!it || it.type !== 'use') return;
    const encOnly = it.key === 'salt' || it.key === 'orgel' || it.key === 'photo';
    if (S.enc) {
      // 遭遇中: やり過ごし系と回復だけ使える(回復はラウンドを消費しない)
      if (it.key === 'pan') { S.items.splice(idx, 1); heal(2, 0); log('走りながらパンをかじる。体力+2', 'l-good'); renderAll(); return; }
      if (it.key === 'ramune') { S.items.splice(idx, 1); heal(0, 1); log('ラムネの音で、自分を取り戻す。正気度+1', 'l-good'); renderAll(); return; }
      if (!encOnly) return;
      if (S.enc.unstoppable && it.key !== 'photo') { log('それには、効かない気がする。', 'l-warn'); return; }
      const wasFollower = S.enc.follower;
      S.items.splice(idx, 1);
      if (it.key === 'salt') log('塩を撒いた。空気が、すっと軽くなる。', 'l-good');
      else if (it.key === 'orgel') log('オルゴールの蓋を開ける。澄んだ音。……気配が、遠ざかった。', 'l-good');
      else log('写真をかざす。写っていない生徒たちの視線が、相手に集まった。', 'l-good');
      S.enc = null;
      if (wasFollower) { S.stays = 0; log('気配が、少しだけ後ろに下がった。', 'l-warn'); }
      completeTurn();
      return;
    }
    if (encOnly) return;
    S.items.splice(idx, 1);
    if (it.key === 'pan') { heal(2, 0); log('購買のパンを食べた。一瞬だけ、普通の放課後みたいだ。体力+2', 'l-good'); }
    else if (it.key === 'ramune') { heal(0, 1); log('ラムネを口に放り込む。甘い。正気度+1', 'l-good'); }
    else if (it.key === 'chalk') { S.chalk = true; log('チョークで足元に輪を描いた。ここにいる間は、たぶん大丈夫。', 'l-good'); }
    else if (it.key === 'camera') {
      S.offers.forEach(o => { if (!o.blocked) o.revealed = true; });
      log('フラッシュ。焼き付いた残像に、この先の気配が写っている。', 'l-good');
    }
    else if (it.key === 'note') {
      S.mp -= 1;
      log('謎のノートを読む。文字が、目の奥に直接くる。正気度-1', 'l-bad');
      checkDead();
      if (!S.over) { goalHint(); S.goalSense = Math.max(S.goalSense, 3); }
    }
    else if (it.key === 'yakuhin') {
      if (Math.random() < 0.5) { heal(2, 0); log('薬品を飲んだ。……悪くない。体力+2', 'l-good'); }
      else { S.mp -= 1; log('薬品を飲んだ。舌の上で、味が三回変わった。正気度-1', 'l-bad'); checkDead(); }
    }
    else if (it.key === 'watch') { S.timeStop = true; log('腕時計の竜頭を押した。4時44分。——世界の音が、止んでいる。', 'l-warn'); }
    renderAll();
  }

  // ================= turn end =================
  function completeTurn() {
    if (S.over) { renderAll(); return; }
    if (S.enc || S.student) { renderAll(); return; }
    if (S.pendingEnd) {
      S.pendingEnd = false;
      endTurn();
      if (!S.over) makeOffers();
    }
    renderAll();
  }

  function endTurn() {
    if (S.over) return;
    if (S.timeStop) { S.timeStop = false; log('時計が動き出す。時間は経っていない。', 'l-warn'); return; }
    if (S.skipTick) { S.skipTick = false; return; }
    S.turn++;
    const ph = phase();
    if (ph.idx === 2 && S.char.ability !== 'nightowl') {
      S.drainCounter++;
      if (S.drainCounter % 3 === 0) {
        S.mp -= 1;
        log('丑三つ時。夜が、体温を奪っていく。正気度-1', 'l-bad');
        checkDead();
      }
    }
    if (!S.over && S.turn >= S.diff.turns) {
      const all = S.activeGoals.every(g => S.goals[g.key]);
      endGame(all ? 'win' : 'noReturn');
    }
  }

  function endGame(kind) {
    S.over = true;
    S.won = kind === 'win';
    S.ending = kind;
    renderAll();
    setTimeout(() => {
      const t = $('resultTitle'), b = $('resultBody'), st = $('resultStats');
      t.classList.toggle('bad', kind !== 'win');
      if (kind === 'win') {
        t.textContent = '夜 明 け';
        b.innerHTML = '窓の外が白む。チャイムが鳴った。今度のは、ちゃんと壊れていない音だ。<br>' +
          '上履きを履き替え、かばんを背負い、鍵を回す。扉は、当たり前みたいに開いた。<br>' +
          `${S.char.name}は振り返らずに校門を出る。——教室のどこかで、誰かがまだ笑っている気がした。`;
      } else if (kind === 'noReturn') {
        t.textContent = '帰 れ な い 朝';
        b.innerHTML = 'チャイムが鳴って、廊下に朝の光が差した。<br>' +
          'でも昇降口の扉は開かず、下駄箱に上履きはなく、かばんも、どこにもない。<br>' +
          '放送が言う。『——では、今日も一日、がんばりましょう』<br>まだ、帰り支度が済んでいない。';
      } else if (kind === 'death') {
        t.textContent = '下 校 時 刻';
        b.innerHTML = '膝から力が抜けて、冷たい床の感触も遠くなる。<br>遠くでチャイムが鳴っている。もう、どうでもいいような気がした。';
      } else if (kind === 'caught') {
        t.textContent = '置 き 去 り';
        b.innerHTML = 'うしろのものに、追いつかれた。<br>' +
          '長く一つの場所にいすぎた。それはずっと、こちらの歩幅に合わせて歩いてくれていたのだ。<br>' +
          '翌朝、その教室のカーテンは、窓が閉まっているのに揺れていたという。';
      } else {
        t.textContent = '転 入 届';
        b.innerHTML = `気がつくと、${S.char.name}は自分の席に座っていた。<br>` +
          '「ずっと前からこの学校の生徒だった」——そう思うと、なんだか安心した。<br>この学校には、生徒がとても多い。';
      }
      const goalsGot = S.activeGoals.filter(g => S.goals[g.key]).map(g => g.name).join('・') || 'なし';
      st.innerHTML = `探索した部屋: ${S.roomsExplored} / 生き延びたターン: ${S.turn} / ${S.diff.name}<br>` +
        `集めた帰り支度: ${goalsGot} (${S.activeGoals.filter(g => S.goals[g.key]).length}/${S.activeGoals.length})` +
        (S.omamoriUsed ? ` / 砕けたお守り: ${S.omamoriUsed}` : '');
      // 今夜の記録(全ログ)を結末込みで読める・コピーできるように
      log('', null);
      log(`—— ${t.textContent.replace(/ /g, '')} ——`, kind === 'win' ? 'l-good' : 'l-bad');
      b.innerHTML.split('<br>').forEach(line => log(line.replace(/<[^>]*>/g, '')));
      const rl = $('resultLog');
      rl.innerHTML = '';
      for (const entry of S.fullLog) {
        const el = document.createElement('div');
        if (entry.c) el.className = entry.c;
        el.textContent = entry.t;
        rl.appendChild(el);
      }
      rl.scrollTop = rl.scrollHeight;
      $('copyFb').textContent = '';
      showScreen('result');
    }, 900);
  }

  // ================= log =================
  function log(text, cls) {
    S.fullLog.push({ t: text, c: cls });
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.textContent = text;
    const box = $('log');
    box.appendChild(el);
    while (box.children.length > 90) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  // ================= rendering =================
  function pips(v, max, hp) {
    let s = '';
    for (let i = 0; i < max; i++) s += `<span class="${i < v ? 'on' : 'off'}">${hp ? '●' : '◆'}</span>`;
    return s;
  }

  function renderAll() {
    if (!S) return;
    $('pName').textContent = S.char.name;
    $('pPortrait').innerHTML = portraitSVG(S.char.look);
    $('hpPips').innerHTML = pips(Math.max(0, S.hp), S.maxHp, true);
    $('mpPips').innerHTML = pips(Math.max(0, S.mp), S.maxMp, false);
    $('statLine').textContent = `${statOf('str')} / ${statOf('agi')} / ${statOf('int')}`;
    $('hereName').textContent = here().room.name;
    $('turnLine').textContent = `${Math.max(0, S.diff.turns - S.turn)} ターン`;
    $('phaseFill').style.width = clamp(S.turn / S.diff.turns * 100, 0, 100) + '%';
    $('phaseName').textContent = '— ' + phase().name + ' —';
    $('followLine').textContent = S.stays >= 3 ? 'うしろの気配: すぐそこにいる'
      : S.stays >= 1 ? 'うしろの気配: ' + '!'.repeat(S.stays) : '';

    // goals
    const gb = $('goalBox');
    gb.innerHTML = '';
    for (const g of S.activeGoals) {
      const d = document.createElement('div');
      d.className = 'goal' + (S.goals[g.key] ? ' done' : '');
      d.textContent = (S.goals[g.key] ? '✓ ' : '') + g.name;
      gb.appendChild(d);
    }

    // items
    const ib = $('itemBox');
    ib.innerHTML = '';
    if (S.items.length === 0) {
      const d = document.createElement('div');
      d.className = 'item'; d.innerHTML = '<span class="idesc">なにも持っていない</span>';
      ib.appendChild(d);
    }
    S.items.forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = `<span>${it.name} <span class="idesc">${it.desc}</span></span>`;
      if (it.type === 'use') {
        const encOnly = it.key === 'salt' || it.key === 'orgel' || it.key === 'photo';
        const usable = !S.over && !S.student && (S.enc ? encOnly : !encOnly || true) && (S.enc ? encOnly : true);
        const b = document.createElement('button');
        b.textContent = '使う';
        b.disabled = !usable || (!S.enc && encOnly);
        b.addEventListener('click', () => useItem(i));
        d.appendChild(b);
      }
      ib.appendChild(d);
    });

    // encounter / student / actions
    const eb = $('encBox'), sb = $('stuBox'), ab = $('actionBox');
    if (S.enc) {
      eb.hidden = false; sb.hidden = true; ab.innerHTML = '';
      const e = S.enc;
      const portrait = e.look ? `<div style="display:flex;gap:10px;align-items:flex-start">
          <div style="width:64px;flex:none;border-radius:6px;overflow:hidden;background:#050807">${portraitSVG(e.look)}</div>
          <div><div class="ename">${e.name}</div><div class="eline">${e.line}</div></div>
        </div>` : `<div class="ename">${e.name}</div><div class="eline">${e.line}</div>`;
      const status = e.follower ? '<div class="eline" style="color:var(--danger)">勝てない。逃げるしかない。</div>'
        : e.staggered ? '<div class="eline" style="color:var(--warn)">相手は怯んでいる——確実に逃げられる。追撃すれば撃退できるかもしれない。</div>'
        : (e.fight !== null && !hasWeapon()) ? '<div class="eline">武器がない。押しのけて逃げるくらいしかできない。</div>' : '';
      eb.innerHTML = portrait + status;
      const row = document.createElement('div');
      row.style.display = 'flex'; row.style.gap = '6px'; row.style.flexWrap = 'wrap';
      encActions().forEach(a => {
        const b = document.createElement('button');
        b.style.flex = '1';
        b.style.minWidth = '40%';
        b.textContent = a.auto ? `${a.label}(確実)` : `${a.label} (${a.target}+)`;
        b.disabled = S.over;
        b.addEventListener('click', () => resolveEncounter(a.k));
        row.appendChild(b);
      });
      eb.appendChild(row);
    } else if (S.student) {
      eb.hidden = true; sb.hidden = false; ab.innerHTML = '';
      const { stu } = S.student;
      const nameLine = `${stu.surname} ${stu.given}` + (stu.reading ? `(「${stu.reading}」と読むらしい)` : '');
      const sameName = PROTAG_SURNAMES.includes(stu.surname) ? '<br>……聞き覚えのある苗字だ。' : '';
      sb.innerHTML = `<div class="stop">
          <div class="sportrait">${portraitSVG(stu.look)}</div>
          <div>
            <div class="sname">${nameLine}</div>
            <div class="sinfo">${stu.grade}年${stu.classNo}組<br>上履き: ${stu.shoe} / ジャージ: ${stu.jersey}${sameName}</div>
          </div>
        </div>
        <div class="sline">「こんな時間まで、なにしてるの」</div>`;
      const b = document.createElement('button');
      b.textContent = '……先へ行く';
      b.addEventListener('click', dismissStudent);
      sb.appendChild(b);
    } else {
      eb.hidden = true; sb.hidden = true;
      ab.innerHTML = '';
      const cur = here();
      const mk = (label, fn, dis) => {
        const b = document.createElement('button');
        b.textContent = label; b.disabled = !!dis || S.over;
        b.addEventListener('click', fn);
        ab.appendChild(b);
      };
      mk('手当て(体力+' + (cur.room.key === 'hoken' ? 2 : 1) + ')', () => doRest('hp'), S.hp >= S.maxHp || S.intro);
      mk('深呼吸(正気度+1)', () => doRest('mp'), S.mp >= S.maxMp || S.intro);
      mk('探索する', doSearch, S.intro);
    }

    renderIntro();
    renderOffers();
    renderBoard();
  }

  function renderIntro() {
    const box = $('introBox');
    if (!S.intro || S.over) { box.hidden = true; return; }
    box.hidden = false;
    const goalRows = S.activeGoals.map(g =>
      `<div class="gitem"><span>${g.name}</span><span class="where">${g.rooms.map(k => roomByKey(k).name).join('・')}</span></div>`
    ).join('');
    box.innerHTML = `<h3>今夜のきまり</h3>
      <div class="rule">・夜明けまで <b>${S.diff.turns}ターン</b>。生き延びること。<br>
      ・帰るには、下の<b>帰り支度</b>を探索で集めておくこと。</div>
      <div class="glist">${goalRows}</div>
      <div class="rule dim">・来た道には戻れない。うしろから、なにか付いてきている。<br>
      ・同じ場所に留まりすぎると、<b>追いつかれる</b>。それに勝つ方法はない。<br>
      ・体力が尽きれば死ぬ。正気度が尽きれば——この学校の生徒になる。</div>`;
    const b = document.createElement('button');
    b.id = 'introOk';
    b.textContent = 'わかった';
    b.addEventListener('click', () => { S.intro = false; renderAll(); });
    box.appendChild(b);
  }

  function renderOffers() {
    const box = $('offers');
    box.innerHTML = '';
    if (!S || S.over || S.enc || S.student || S.intro) return;
    S.offers.forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'offer' + (o.blocked ? ' blocked' : '');
      if (o.blocked) {
        d.innerHTML = `<div class="odir">${o.label}</div>
          <div class="oart"></div>
          <div class="oname">足音がする</div>
          <div class="ohint">来た道には、戻れない</div>`;
      } else {
        d.innerHTML = `<div class="odir">${o.label}</div>
          <div class="oart">${roomArtSVG(o.type.key, o.type.warped)}</div>
          <div class="oname">${o.type.name}</div>
          <div class="ohint">${o.revealed ? HINT_TEXT[o.evKind] : ''}</div>`;
        d.addEventListener('click', () => chooseOffer(i));
      }
      box.appendChild(d);
    });
  }

  function renderBoard() {
    const board = $('board');
    board.innerHTML = '';
    for (const cell of S.map.values()) {
      const d = document.createElement('div');
      d.className = 'room' + (cell.room.warped ? ' warped' : '');
      if (cell.x === S.pos.x && cell.y === S.pos.y) d.classList.add('cur');
      d.style.left = (cell.x * CELL) + 'px';
      d.style.top = (cell.y * CELL) + 'px';
      d.innerHTML = `<div class="rart">${roomArtSVG(cell.room.key === 'genkan' ? 'genkan' : cell.room.key, cell.room.warped)}</div>` +
        `<div class="rname">${cell.room.name}</div>`;
      board.appendChild(d);
    }
    const m = document.createElement('div');
    m.id = 'marker';
    m.textContent = S.char.name[3] || S.char.name[0];
    m.style.left = (S.pos.x * CELL + 45) + 'px';
    m.style.top = (S.pos.y * CELL + 45) + 'px';
    board.appendChild(m);
  }

  // ================= board pan / zoom =================
  let view = { ox: 0, oy: 0, scale: 1 };
  function applyView() {
    $('board').style.transform = `translate(${view.ox}px, ${view.oy}px) scale(${view.scale})`;
  }
  function centerOnPlayer(smooth) {
    const wrap = $('board-wrap');
    view.ox = wrap.clientWidth / 2 - (S.pos.x * CELL + 60) * view.scale;
    view.oy = wrap.clientHeight / 2 - 60 - (S.pos.y * CELL + 60) * view.scale;
    $('board').style.transition = smooth ? 'transform 0.35s ease' : 'none';
    applyView();
  }
  (function setupPan() {
    const wrap = $('board-wrap');
    let dragging = false, lx = 0, ly = 0;
    wrap.addEventListener('pointerdown', e => {
      if (e.target.closest('.offer')) return;
      dragging = true; lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (!dragging) return;
      $('board').style.transition = 'none';
      view.ox += e.clientX - lx; view.oy += e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      applyView();
    });
    window.addEventListener('pointerup', () => { dragging = false; });
    wrap.addEventListener('wheel', e => {
      e.preventDefault();
      view.scale = clamp(view.scale * (e.deltaY < 0 ? 1.1 : 0.9), 0.35, 1.6);
      $('board').style.transition = 'none';
      applyView();
    }, { passive: false });
  })();

  // ================= screens & title =================
  function showScreen(name) {
    $('screen-title').hidden = name !== 'title';
    $('screen-game').hidden = name !== 'game';
    $('screen-result').hidden = name !== 'result';
  }

  let selChar = 0, selDiff = 1;
  function buildTitle() {
    const row = $('charRow');
    row.innerHTML = '';
    CHARS.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'char-card' + (i === selChar ? ' sel' : '');
      d.innerHTML = `<div class="cportrait">${portraitSVG(c.look)}</div>` +
        `<h3>${c.name}</h3><div class="cdesc">${c.desc}</div>` +
        `<div class="cstats">体力 ${'●'.repeat(c.hp)}  正気度 ${'◆'.repeat(c.mp)}<br>腕力${c.str} 敏捷${c.agi} 直感${c.int}</div>` +
        `<div class="cab">${c.abilityText}</div>`;
      d.addEventListener('click', () => { selChar = i; buildTitle(); });
      row.appendChild(d);
    });
    const dr = $('diffRow');
    dr.innerHTML = '';
    DIFFS.forEach((df, i) => {
      const b = document.createElement('button');
      b.textContent = `${df.name} (${df.turns}ターン)`;
      b.className = i === selDiff ? 'sel' : '';
      b.addEventListener('click', () => { selDiff = i; buildTitle(); });
      dr.appendChild(b);
    });
  }
  buildTitle();
  $('startBtn').addEventListener('click', () => newGame(selChar, selDiff));
  $('againBtn').addEventListener('click', () => { showScreen('title'); buildTitle(); });
  $('copyLogBtn').addEventListener('click', async () => {
    const text = S ? S.fullLog.map(e => e.t).join('\n') : '';
    const done = () => { $('copyFb').textContent = 'コピーした。'; };
    try { await navigator.clipboard.writeText(text); done(); }
    catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (err2) { $('copyFb').textContent = 'コピーできなかった。'; }
      ta.remove();
    }
  });

  // ================= debug hooks =================
  window.__game = {
    newGame: (c, d) => newGame(c, d),
    state: () => S && {
      hp: S.hp, mp: S.mp, turn: S.turn, over: S.over, won: S.won, ending: S.ending,
      enc: !!S.enc, student: !!S.student, rooms: S.roomsExplored,
      items: S.items.map(i => i.key), goals: { ...S.goals },
      here: here().room.key, pos: { ...S.pos },
    },
    offers: () => S ? S.offers.map((o, i) => ({ i, label: o.label, blocked: o.blocked, type: o.type && o.type.key })) : [],
    choose: i => chooseOffer(i),
    rest: k => doRest(k),
    search: () => doSearch(),
    dismissStudent: () => dismissStudent(),
    encounterOptions: () => (S && S.enc) ? encActions().map(a => a.k) : [],
    dismissIntro: () => { if (S) { S.intro = false; renderAll(); } },
    encounterAct: k => resolveEncounter(k),
    useItem: i => useItem(i),
  };
})();
</script>
</body>
</html>
